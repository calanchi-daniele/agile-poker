name: Build & Push API to GHCR

# 1. This tells GitHub to run this script every time you push to the main branch
on:
  push:
    branches: [ "main" ]
    paths:
      - 'agile-poker-api/**' 
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4 
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase image name
      run: |
        REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_NAME=ghcr.io/$REPO_LC-api:latest" >> $GITHUB_ENV

    - name: Build and push container
      uses: docker/build-push-action@v7 
      with:
        context: ./agile-poker-api
        file: ./agile-poker-api/Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}